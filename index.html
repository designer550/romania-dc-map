<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Romania 400 kV + DC sites</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root { --ink:#1a1a1a; --muted:#5c5c5c; --line:#e6e2d9; --bg:#f7f4ee; --card:#fff; --blue:#1f4e79; --red:#b13228; --green:#2e7d4f; --amber:#b56a12; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; width:100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); overflow:hidden; overscroll-behavior:none; position:fixed; inset:0; touch-action:manipulation; }
  #map { position:fixed; inset:0 0 42% 0; }
  #map.full { inset:0 0 52px 0; }
  #sheet { position:fixed; left:0; right:0; bottom:0; height:42%; background:var(--card); border-top:1px solid var(--line); overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:none; padding:12px 16px calc(16px + env(safe-area-inset-bottom)); }
  #sheet.collapsed { height:52px; overflow:hidden; padding:8px 16px calc(8px + env(safe-area-inset-bottom)); }
  #sheet.collapsed .sheet-body { display:none; }
  .handle { width:36px; height:4px; background:#ccc; border-radius:2px; margin:0 auto 8px; }
  .grab { touch-action:none; padding:8px 0 4px; margin:-8px 0 0; }
  .peek { display:none; font-size:12px; color:var(--muted); text-align:center; }
  #sheet.collapsed .peek { display:block; }
  @media (min-width: 900px) {
    #map, #map.full { right: 380px; inset:0 380px 0 0; }
    #sheet, #sheet.collapsed { top:0; left:auto; width:380px; height:100%; border-top:none; border-left:1px solid var(--line); padding:12px 16px; overflow:auto; }
    #sheet.collapsed .sheet-body { display:block; }
    .handle, .peek, .grab { display:none; }
  }
  h1 { font-size:16px; margin:0 0 4px; }
  .sub { font-size:12px; color:var(--muted); margin:0 0 12px; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .filters button { font-size:12px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 10px; }
  .filters button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .item { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:0 0 8px; }
  .item h2 { font-size:14px; margin:0 0 4px; }
  .meta { font-size:12px; color:var(--muted); }
  .tag { display:inline-block; font-size:10px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; padding:2px 6px; border-radius:4px; margin-right:4px; }
  .t-live { background:#d9f2e3; color:#1e6b3a; }
  .t-grid { background:#fde7c7; color:#8a4b00; }
  .t-ann { background:#f3e2e0; color:#8a2b22; }
  .t-eoi { background:#e8e8e8; color:#444; }
  .t-plan { background:#d9e6f2; color:#1f4e79; }
  .t-st { background:#e7eef5; color:#1f4e79; }
  a { color:var(--blue); }
  .sources { font-size:11px; margin-top:6px; }
  .sources a { display:block; margin:2px 0; }
  .legend { font-size:11px; color:var(--muted); margin-bottom:10px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:9999;background:#f7f4ee;display:flex;align-items:center;justify-content:center;padding:24px;">
  <form onsubmit="return unlock(event)" style="width:100%;max-width:320px">
    <p style="font-size:16px;margin:0 0 12px">Romania DC map</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" style="width:100%;font-size:16px;padding:12px;border:1px solid #e6e2d9;border-radius:8px"/>
    <button type="submit" style="width:100%;margin-top:8px;font-size:16px;padding:12px;border:0;border-radius:8px;background:#1a1a1a;color:#fff">Open</button>
    <p id="pwerr" style="color:#b13228;font-size:12px;display:none;margin:8px 0 0">Wrong password</p>
  </form>
</div>
<script>
var PWKEY = 'ro-dc-map-ok';
function openMap(){
  var g = document.getElementById('gate');
  if (g) g.remove();
  setTimeout(function(){ try { map.invalidateSize(); } catch (x) {} }, 50);
}
function unlock(e){
  e.preventDefault();
  if (document.getElementById('pw').value === 'n7kQ-2mPx') {
    try { localStorage.setItem(PWKEY, '1'); } catch (x) {}
    openMap();
  } else {
    document.getElementById('pwerr').style.display='block';
  }
  return false;
}
try { if (localStorage.getItem(PWKEY) === '1') {
  document.getElementById('gate').style.display = 'none';
  document.addEventListener('DOMContentLoaded', openMap);
}} catch (x) {}
</script>

<div id="map"></div>
<div id="sheet">
  <div class="grab"><div class="handle"></div><div class="peek">Map — pull up for list</div></div>
  <div class="sheet-body">
  <h1>Romania power + DC map</h1>
  <p class="sub">Tap a pin. 400 kV = fatter pipe (1–2 year path). Positions of stations are town-level, not fence-level.</p>
  <div class="legend">
    <span class="dot" style="background:#1f4e79"></span>400 kV
    <span class="dot" style="background:#b13228; margin-left:10px"></span>DC project
    <span class="dot" style="background:#b56a12; margin-left:10px"></span>Planned 400 kV line
  </div>
  <div class="filters">
    <button class="on" data-f="all">All</button>
    <button data-f="project">DC projects</button>
    <button data-f="st400">400 kV</button>
    <button data-f="planned">Planned lines</button>
  </div>
  <div id="detail"></div>
  <div id="list"></div>
</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const PLANNED = [
  { name:"Gădălin – Suceava 400 kV", from:[46.92,23.85], to:[47.65,26.25], when:"Under build. Completes the north 400 kV ring.", src:"Transelectrica STT Cluj / STT Bacău pages" },
  { name:"Gutinaș – Smârdan 400 kV", from:[46.35,26.85], to:[45.48,27.95], when:"In investment list (Black Sea corridor).", src:"Transelectrica STT Constanța / STT Bacău" }
];

const map = L.map("map", { zoomControl: true }).setView([45.6, 25.0], 6.4);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: "&copy; OSM &copy; CARTO",
  maxZoom: 18
}).addTo(map);

const layers = { project: L.layerGroup().addTo(map), st400: L.layerGroup().addTo(map), planned: L.layerGroup().addTo(map) };
const byId = {};

function kvIcon() {
  return L.divIcon({ className:"", html:"<div style='width:12px;height:12px;border-radius:50%;background:#1f4e79;border:2px solid #fff;box-shadow:0 0 0 1px #1f4e79'></div>", iconSize:[12,12], iconAnchor:[6,6] });
}
function projIcon(color) {
  return L.divIcon({ className:"", html:`<div style="width:14px;height:14px;background:${color};border:2px solid #fff;box-shadow:0 0 0 1px ${color}"></div>`, iconSize:[14,14], iconAnchor:[7,7] });
}

const stageClass = { live:"t-live", grid:"t-grid", ann:"t-ann", eoi:"t-eoi" };

function show(obj, kind) {
  const el = document.getElementById("detail");
  if (kind === "st") {
    el.innerHTML = `<div class="item"><span class="tag t-st">400 kV station</span>
      <h2>${obj.name}</h2>
      <div class="meta">${obj.region}. Transelectrica high-voltage hub. 100 MW is a small ask here vs 220 kV.
      <div class="sources"><a href="https://www.transelectrica.ro/ro/web/tel/date-generale-management" target="_blank">Transelectrica: 38 stations at 400 kV</a></div></div></div>`;
    return;
  }
  if (kind === "line") {
    el.innerHTML = `<div class="item"><span class="tag t-plan">Planned line</span>
      <h2>${obj.name}</h2><div class="meta">${obj.when}<div class="sources">${obj.src}</div></div></div>`;
    return;
  }
  const p = obj;
  el.innerHTML = `<div class="item">
    <span class="tag ${stageClass[p.stage]}">${p.stageLabel}</span>
    <h2>${p.name}</h2>
    <div class="meta">
      <b>MW:</b> ${p.mw}<br/>
      <b>Voltage:</b> ${p.kv}<br/>
      <b>Land:</b> ${p.land}<br/>
      <b>Grid / ATR:</b> ${p.atr}<br/>
      <b>Use:</b> ${p.use}<br/>
      <b>By 2030:</b> ${p.by2030}
      <div class="sources">${p.sources.map(s=>`<a href="${s[1]}" target="_blank">${s[0]}</a>`).join("")}</div>
    </div>
  </div>`;
  document.getElementById("sheet").scrollTop = 0;
}

ST400.forEach(s => {
  const m = L.marker([s.lat, s.lng], { icon: kvIcon(), zIndexOffset: 0 }).addTo(layers.st400);
  m.on("click", () => { map.panTo(m.getLatLng()); show(s, "st"); });
  m.bindTooltip(s.name, { direction:"top", offset:[0,-8] });
  byId[s.id] = m;
});

const colors = { live:"#1e7a3a", grid:"#b56a12", ann:"#b13228", eoi:"#666" };
PROJECTS.forEach(p => {
  const m = L.marker([p.lat, p.lng], { icon: projIcon(colors[p.stage]), zIndexOffset: 500 }).addTo(layers.project);
  m.on("click", () => { map.setView(m.getLatLng(), 10); show(p, "proj"); });
  m.bindTooltip(p.name.split(",")[0], { direction:"top", offset:[0,-8] });
  byId[p.id] = m;
});

PLANNED.forEach(l => {
  const line = L.polyline([l.from, l.to], { color:"#b56a12", weight:3, dashArray:"6 6" }).addTo(layers.planned);
  line.on("click", () => show(l, "line"));
  line.bindTooltip(l.name);
});

const list = document.getElementById("list");
list.innerHTML = "<h2 style='font-size:13px;margin:12px 0 6px'>DC projects</h2>" + PROJECTS.map(p =>

).join("");

window.focusProj = function(id) {
  const p = PROJECTS.find(x => x.id===id);
  const m = byId[id];
  if (m) { map.setView(m.getLatLng(), 10); m.openTooltip(); }
  show(p, "proj");
};

document.querySelectorAll(".filters button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".filters button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    const f = b.dataset.f;
    ["project","st400","planned"].forEach(k => {
      if (f==="all" || f===k) map.addLayer(layers[k]); else map.removeLayer(layers[k]);
    });
  };
});

(function(){
  const sheet = document.getElementById("sheet");
  const mapEl = document.getElementById("map");
  const grab = sheet.querySelector(".grab");
  if (!grab) return;
  function isDesktop(){ return window.matchMedia("(min-width: 900px)").matches; }
  function size(){ setTimeout(function(){ try { map.invalidateSize(); } catch (x) {} }, 60); }
  function collapse(){
    if (isDesktop()) return;
    sheet.classList.add("collapsed");
    mapEl.classList.add("full");
    size();
  }
  function expand(){
    sheet.classList.remove("collapsed");
    mapEl.classList.remove("full");
    size();
  }
  grab.addEventListener("click", function(){
    if (sheet.classList.contains("collapsed")) expand(); else collapse();
  });
  let y0 = 0, drag = false;
  function onStart(y){ y0 = y; drag = true; }
  function onMove(y, ev){
    if (!drag) return;
    const dy = y - y0;
    if (dy > 28) { if (ev) ev.preventDefault(); collapse(); drag = false; }
    if (dy < -28) { expand(); drag = false; }
  }
  grab.addEventListener("touchstart", function(e){ onStart(e.touches[0].clientY); }, {passive:true});
  grab.addEventListener("touchmove", function(e){ onMove(e.touches[0].clientY, e); }, {passive:false});
  grab.addEventListener("touchend", function(){ drag = false; });
  sheet.addEventListener("touchstart", function(e){
    y0 = e.touches[0].clientY;
  }, {passive:true});
  sheet.addEventListener("touchmove", function(e){
    if (isDesktop()) return;
    const dy = e.touches[0].clientY - y0;
    if (!sheet.classList.contains("collapsed") && sheet.scrollTop <= 0 && dy > 24) {
      e.preventDefault();
      collapse();
    }
  }, {passive:false});
})();
</script>
</body>
</html>
